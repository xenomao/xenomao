<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E91E8C"/>
      <stop offset="100%" stop-color="#C2006E"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="200" rx="40" ry="40" fill="url(#bg)"/>

  <!-- "d" — ボールドサンセリフ、白 -->
  <!-- 縦棒 -->
  <rect x="52" y="42" width="22" height="116" rx="11" fill="#ffffff"/>
  <!-- 円弧（右側） -->
  <path d="M74 58 Q140 58 140 100 Q140 142 74 142" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>

  <!-- 右上：小さなスパークル（ビューティアクセント） -->
  <g fill="#ffffff" opacity="0.90">
    <!-- 十字スパークル -->
    <rect x="146" y="36" width="5" height="20" rx="2.5" transform="translate(148.5,46) rotate(0) translate(-148.5,-46)"/>
    <rect x="146" y="36" width="5" height="20" rx="2.5" transform="translate(148.5,46) rotate(90) translate(-148.5,-46)"/>
    <rect x="146" y="36" width="3" height="14" rx="1.5" transform="translate(148.5,46) rotate(45) translate(-148.5,-46)"/>
    <rect x="146" y="36" width="3" height="14" rx="1.5" transform="translate(148.5,46) rotate(135) translate(-148.5,-46)"/>
  </g>
</svg>
