<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C1F30"/>
      <stop offset="100%" stop-color="#4A0E1C"/>
    </linearGradient>
  </defs>

  <!-- 背景：深紅 -->
  <rect width="200" height="200" rx="40" ry="40" fill="url(#bg)"/>

  <!-- "d" ホワイト -->
  <rect x="52" y="42" width="22" height="116" rx="11" fill="#ffffff"/>
  <path d="M74 58 Q142 58 142 100 Q142 142 74 142"
        fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>

  <!-- スパークル（右上）ホワイト -->
  <g fill="#ffffff" opacity="0.75">
    <rect x="147" y="37" width="4" height="18" rx="2"
          transform="translate(149,46) rotate(0) translate(-149,-46)"/>
    <rect x="147" y="37" width="4" height="18" rx="2"
          transform="translate(149,46) rotate(90) translate(-149,-46)"/>
    <rect x="147" y="37" width="2.5" height="12" rx="1.25"
          transform="translate(149,46) rotate(45) translate(-149,-46)"/>
    <rect x="147" y="37" width="2.5" height="12" rx="1.25"
          transform="translate(149,46) rotate(135) translate(-149,-46)"/>
  </g>
</svg>
