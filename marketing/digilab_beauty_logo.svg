    <rect x="147" y="37" width="4" height="18" rx="2" transform="translate(149,46) rotate(0) translate(-149,-46)"/>
    <rect x="147" y="37" width="4" height="18" rx="2" transform="translate(149,46) rotate(90) translate(-149,-46)"/>
    <rect x="147" y="37" width="2.5" height="12" rx="1.25" transform="translate(149,46) rotate(45) translate(-149,-46)"/>
