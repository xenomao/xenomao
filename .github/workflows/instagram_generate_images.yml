name: Instagram 投稿画像の生成

on:
  workflow_dispatch:
    inputs:
      force:
        description: 既存画像も作り直す
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - marketing/instagram/post_queue.json
      - marketing/instagram/templates/**
      - scripts/generate_post_image.py

permissions:
  contents: write

concurrency:
  group: instagram-generate-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージをインストール
        run: |
          pip install pillow
          # 日本語が豆腐にならないようフォントを入れる
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 投稿画像を生成
        run: |
          python scripts/generate_post_image.py \
            ${{ inputs.force && '--force' || '' }}

      - name: 生成した画像をコミット
        run: |
          if [ -n "$(git status --porcelain public/instagram)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add public/instagram
            git commit -m 'chore: Instagram投稿画像を自動生成'
            git push
          else
            echo "生成された画像に変更はありません。"
          fi
